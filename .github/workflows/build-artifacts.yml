name: Build & Package AuraWave Windows x64 Deliverables

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Full Build, Test, Publish & ZIP Packaging Pipeline
        shell: pwsh
        run: |
          ./scripts/package.ps1

      - name: Upload Portable Windows x64 Application ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AuraWave-Portable-Windows-x64
          path: dist/AuraWave-Portable-Windows-x64.zip
          if-no-files-found: error

      - name: Upload Source Code Archive ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AuraWave-Source
          path: dist/AuraWave-Source.zip
          if-no-files-found: error

      - name: Upload Complete Release Bundle ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AuraWave-Complete-Bundle
          path: |
            dist/AuraWave-Complete-Bundle.zip
            dist/AuraWave-STEP-BY-STEP-GUIDE.md
            dist/SHA256SUMS.txt
          if-no-files-found: error